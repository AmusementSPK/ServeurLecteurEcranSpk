<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Local Display Server Player</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <video id="player" autoplay muted playsinline></video>

  <div id="overlay" class="overlay">
    <div class="panel">
      <div id="brandName" class="brand">LOCAL DISPLAY SERVER</div>
      <h1 id="title">Choose this screen</h1>
      <p id="subtitle">Loading screen list from the server…</p>
      <div id="tvList" class="tv-list"></div>
      <div id="status" class="status"></div>
      <div class="help">Mouse + left click · pointer at top/bottom = auto-scroll · ▲ ▼ + OK also supported</div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js?v=6"></script>
</body>
</html>
