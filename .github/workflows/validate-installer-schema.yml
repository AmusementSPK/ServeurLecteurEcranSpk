name: Validate Installer Schema

on:
  push:
    branches: [ main ]
    paths:
      - 'Installer/Windows/**'
      - '.github/workflows/validate-installer-schema.yml'

permissions:
  contents: read

jobs:
  wix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Create dummy packaging inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/server, artifacts/manager, artifacts/ffmpeg | Out-Null
          Set-Content artifacts/server/DisplayServer.Server.exe 'dummy'
          Set-Content artifacts/server/appsettings.json '{}'
          New-Item -ItemType Directory -Force artifacts/server/wwwroot | Out-Null
          Set-Content artifacts/server/wwwroot/index.html '<html></html>'
          Set-Content artifacts/manager/DisplayServer.Manager.exe 'dummy'
          Set-Content artifacts/manager/runtime.dll 'dummy'
          Set-Content artifacts/ffmpeg/ffmpeg.exe 'dummy'
          Set-Content artifacts/ffmpeg/ffmpeg.version.txt 'dummy'
      - name: Compile WiX MSI
        shell: pwsh
        run: |
          $server = Join-Path $env:GITHUB_WORKSPACE 'artifacts\server'
          $manager = Join-Path $env:GITHUB_WORKSPACE 'artifacts\manager'
          $ffmpeg = Join-Path $env:GITHUB_WORKSPACE 'artifacts\ffmpeg\ffmpeg.exe'
          $ffmpegVersion = Join-Path $env:GITHUB_WORKSPACE 'artifacts\ffmpeg\ffmpeg.version.txt'
          dotnet build Installer/Windows/DisplayServer.Setup.wixproj `
            -c Release `
            -p:ServerPublishDir="$server" `
            -p:ManagerPublishDir="$manager" `
            -p:FfmpegExe="$ffmpeg" `
            -p:FfmpegVersionFile="$ffmpegVersion" `
            -p:ProductVersion="1.0.999"
