name: Assemble Roku ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'Roku/.assemble-roku'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and commit Roku ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Roku/.assemble-roku ]; then
            echo "Nothing to assemble."
            exit 0
          fi

          cat Roku/.parts/part00 Roku/.parts/part01 Roku/.parts/part02 Roku/.parts/part03 Roku/.parts/part04 Roku/.parts/part05 Roku/.parts/part06 > /tmp/roku.zip.b64
          base64 --decode /tmp/roku.zip.b64 > Roku/SPK_Roku_App_v1.6_DYNAMIC.zip
          unzip -t Roku/SPK_Roku_App_v1.6_DYNAMIC.zip

          rm -rf Roku/.parts Roku/.assemble-roku

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Roku
          git commit -m "Add Roku v1.6 dynamic app ZIP"
          git push
