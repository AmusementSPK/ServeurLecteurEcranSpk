name: Validate SPK Server

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-spk-server.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Release
        run: dotnet build SPK.Streaming.csproj -c Release --nologo
