name: Validate SPK Installer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-spk-installer.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $files = @(
            'Installer/Install-SPKServer.ps1',
            'Installer/SPK_Server_Setup_Wizard.ps1',
            'SPK_Server_Watchdog.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $file" -ForegroundColor Red
              $errors | Format-List *
              exit 1
            }
            Write-Host "OK: $file"
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build server
        run: dotnet build SPK.Streaming.csproj -c Release --nologo
