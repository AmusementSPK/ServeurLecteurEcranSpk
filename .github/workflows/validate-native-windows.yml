name: Validate Native Windows Apps
# rerun after project isolation fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/validate-native-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish SPK Server
        run: dotnet publish SPK.Streaming.csproj -c Release -r win-x64 --self-contained true -o artifacts/server

      - name: Publish SPK Server Manager
        run: dotnet publish Manager/SPK.Server.Manager.csproj -c Release -r win-x64 --self-contained true -o artifacts/manager

      - name: Show outputs
        shell: powershell
        run: |
          Get-ChildItem artifacts/server
          Get-ChildItem artifacts/manager
